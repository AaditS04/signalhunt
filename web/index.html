<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SignalHunt</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: Inter, system-ui, sans-serif; background: #f6f7fb; }
    .card { background: #fff; border: 1px solid #e6e8ef; border-radius: 14px; }
    .nav a.active { background: #eef0ff; color: #3b3fd8; }
    .pill { display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:600; white-space:nowrap; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .quote { border-left: 3px solid #6366f1; background:#f8f8ff; padding:8px 12px; border-radius: 0 8px 8px 0; }
    .spin { animation: spin 1s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
    table td, table th { padding: 10px 12px; }
    .bar { height: 8px; border-radius: 6px; background:#eef0f5; overflow:hidden; } .bar > div { height:100%; background:#6366f1; }
  </style>
</head>
<body class="text-slate-800">
<div class="flex min-h-screen">
  <aside class="w-60 shrink-0 bg-white border-r border-slate-200 hidden md:flex flex-col">
    <div class="px-5 py-5 flex items-center gap-2">
      <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white grid place-items-center font-bold">S</div>
      <div><div class="font-bold leading-tight">SignalHunt</div><div class="text-xs text-slate-500">3PL demand intelligence</div></div>
    </div>
    <nav class="nav px-3 space-y-1 text-sm font-medium text-slate-600">
      <a href="#/" data-r="dash" class="flex px-3 py-2 rounded-lg hover:bg-slate-100">Dashboard</a>
      <a href="#/discover" data-r="discover" class="flex px-3 py-2 rounded-lg hover:bg-slate-100">Discover</a>
      <a href="#/opportunities" data-r="opps" class="flex px-3 py-2 rounded-lg hover:bg-slate-100">Opportunities</a>
      <a href="#/outreach" data-r="outreach" class="flex px-3 py-2 rounded-lg hover:bg-slate-100">Outreach <span id="pendingBadge" class="ml-auto"></span></a>
      <a href="#/activity" data-r="activity" class="flex px-3 py-2 rounded-lg hover:bg-slate-100">System activity</a>
    </nav>
    <div class="mt-auto p-4 text-xs text-slate-500" id="sysStatus"></div>
  </aside>
  <main class="flex-1 min-w-0">
    <div class="md:hidden flex gap-3 p-3 bg-white border-b text-sm overflow-x-auto">
      <a href="#/">Dashboard</a><a href="#/discover">Discover</a><a href="#/opportunities">Opportunities</a><a href="#/outreach">Outreach</a><a href="#/activity">Activity</a>
    </div>
    <div id="view" class="p-4 md:p-8 max-w-7xl mx-auto"></div>
  </main>
</div>
<div id="toast" class="fixed bottom-5 right-5 hidden card px-4 py-3 shadow-lg text-sm"></div>
<script src="/static/app.js"></script>
</body>
</html>
